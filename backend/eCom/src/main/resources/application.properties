spring.application.name=eCom

# 1. Optionally load local overrides for development (ignored in git)
spring.config.import=optional:file:./application-local.properties

# 2. Database Configuration (populated via environment variables or local override)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false

# 3. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Security & JWT
jwt.secret=${JWT_SECRET}

# 5. File Uploads & Logging
spring.servlet.multipart.enabled=true
logging.level.org.springframework.web=DEBUG

# 6. Email Configuration (fallback defaults for host & port)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 7. Razorpay Payment Gateway
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET}
